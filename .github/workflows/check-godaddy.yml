name: Check GoDaddy Connection (no changes)

# Network-only diagnostic: no authentication, no file changes, no deployment.
on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify source and network access
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f wordpress/wp-content/themes/nitiksham-original-v2/style.css
          test -f wordpress/wp-content/plugins/nitiksham-studio/nitiksham-studio.php
          echo "Source files found: OK"

      - name: Probe GoDaddy SSH endpoints on TCP port 22 (no login)
        shell: bash
        run: |
          set -uo pipefail
          reachable=0
          for host in 1322647.eu11.myftpupload.com 1322647.eu11.ssh.myftpupload.com; do
            echo "::group::Checking $host"
            getent ahostsv4 "$host" || true
            if timeout 12 bash -c 'echo > /dev/tcp/"$1"/22' _ "$host" 2>/dev/null; then
              echo "TCP port 22 OPEN for $host"
              reachable=1
            else
              echo "TCP port 22 UNREACHABLE or FILTERED for $host"
            fi
            echo "::endgroup::"
          done
          if [ "$reachable" -eq 0 ]; then
            echo "::error::Neither GoDaddy SSH endpoint is reachable from GitHub Actions on port 22."
            exit 1
          fi
          echo "Network probe completed. This does not validate SSH keys or GoDaddy deploy-user permissions."
