name: Nitiksham cPanel FTPS (manual only)

# Important: preview.nitiksham.com and nitiksham.com share the same document root.
# No automatic deployment. The dedicated FTP account must be restricted in cPanel
# to public_html/preview.nitiksham.com; never grant it /home account-wide access.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check connection first; deploy changes live only with explicit authorization"
        required: true
        type: choice
        default: check
        options:
          - check
          - deploy
      live_confirmation:
        description: "For deploy mode, type LIVE_SITE (both preview and main domain are affected)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nitiksham-cpanel-public-files
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout standalone cPanel source from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate public build before connection
        shell: bash
        run: |
          set -euo pipefail
          root="standalone/public_html"
          test -f "$root/index.html"
          test -f "$root/assets/nitiksham-brand.png"
          test -f "$root/backend-path.php"
          test -f "$root/api/index.php"
          test -f "$root/login/index.php"
          test -f "$root/studio/index.php"
          test -f "$root/.htaccess"
          test ! -f "$root/config.php"
          test ! -d "$root/private"
          find "$root" -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          find "$root" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          echo "Public site lint and layout validation passed."

      - name: Require explicit production authorization
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
        run: |
          test "$LIVE_CONFIRMATION" = "LIVE_SITE" || { echo "::error::Type LIVE_SITE in the confirmation field before deploying."; exit 1; }

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Validate FTPS settings and TCP port (no file changes)
        shell: bash
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_FTP_HOST" || { echo "::error::Missing CPANEL_FTP_HOST secret"; exit 1; }
          test -n "$CPANEL_FTP_USER" || { echo "::error::Missing CPANEL_FTP_USER secret"; exit 1; }
          test -n "$CPANEL_FTP_PASSWORD" || { echo "::error::Missing CPANEL_FTP_PASSWORD secret"; exit 1; }

          # GoDaddy's FTPS certificate was verified by a read-only probe.
          # The account's FTP alias is not covered by the certificate.
          # A valid server hostname has exactly one leftmost label under the wildcard.
          if [[ ! "$CPANEL_FTP_HOST" =~ ^[a-zA-Z0-9-]+\.prod\.sxb1\.secureserver\.net$ ]]; then
            echo "::error::Set CPANEL_FTP_HOST to the exact server hostname from cPanel > Server Information. The FTP alias ftp.y2g.fec.mytemp.website fails TLS hostname verification; the presented certificate covers *.prod.sxb1.secureserver.net."
            exit 1
          fi
          if [ "$CPANEL_FTP_USER" != "nitikshamdeploy@y2g.fec.mytemp.website" ]; then
            echo "::error::CPANEL_FTP_USER does not match the dedicated FTP account shown in cPanel."
            exit 1
          fi

          if ! getent ahostsv4 "$CPANEL_FTP_HOST" >/dev/null; then
            echo "::error::FTP hostname cannot be resolved via DNS."
            exit 1
          fi
          echo "FTP hostname resolves via DNS."
          if ! timeout 12 bash -c 'echo > /dev/tcp/"$1"/21' _ "$CPANEL_FTP_HOST" 2>/dev/null; then
            echo "::error::FTP TCP port 21 is unreachable from the GitHub runner."
            exit 1
          fi
          echo "FTP TCP port 21 is reachable; credentials have NOT been tested yet."

      - name: Test explicit FTPS/TLS login and list files (read-only)
        shell: bash
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # curl requires TLS for both the control and file listing connections.
          # No --insecure flag, and credentials are never printed to the log.
          curl --silent --show-error --fail --ssl-reqd --ftp-pasv \
            --connect-timeout 12 --max-time 45 \
            --user "$CPANEL_FTP_USER:$CPANEL_FTP_PASSWORD" \
            --list-only "ftp://$CPANEL_FTP_HOST/" \
            --output /dev/null
          echo "FTPS certificate, account authentication, and read-only directory listing: OK."

      - name: Deploy only public website files (no delete, manual)
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$CPANEL_FTP_USER","$CPANEL_FTP_PASSWORD" -e "
            set cmd:fail-exit yes
            set ftp:ssl-allow yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ftp:passive-mode yes
            set ssl:verify-certificate yes
            set net:timeout 20
            set net:max-retries 1
            mirror -R --verbose=1 --parallel=2 --no-perms --ignore-time standalone/public_html/ .
            bye
          " "ftp://$CPANEL_FTP_HOST"
          echo "Public website files uploaded. No server-side deletions performed."
