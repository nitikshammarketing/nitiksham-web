name: Nitiksham cPanel FTPS (manual only)

# Important: preview.nitiksham.com and nitiksham.com share the same document root.
# No automatic deployment. The dedicated FTP account must be restricted in cPanel
# to public_html/preview.nitiksham.com; never grant it /home account-wide access.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check connection first; deploy changes live only with explicit authorization"
        required: true
        type: choice
        default: check
        options:
          - check
          - deploy
      live_confirmation:
        description: "For deploy mode, type LIVE_SITE (both preview and main domain are affected)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nitiksham-cpanel-public-files
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cPanel source branch (not WordPress source)
        uses: actions/checkout@v4
        with:
          ref: feature/cpanel-ftps-sync

      - name: Validate public build before connection
        shell: bash
        run: |
          set -euo pipefail
          root="standalone/public_html"
          test -f "$root/index.html"
          test -f "$root/assets/nitiksham-brand.png"
          test -f "$root/backend-path.php"
          test -f "$root/api/index.php"
          test -f "$root/login/index.php"
          test -f "$root/studio/index.php"
          test -f "$root/.htaccess"
          test ! -f "$root/config.php"
          test ! -d "$root/private"
          find "$root" -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          find "$root" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          echo "Public site lint and layout validation passed."

      - name: Require explicit production authorization
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
        run: |
          test "$LIVE_CONFIRMATION" = "LIVE_SITE" || { echo "::error::Type LIVE_SITE in the confirmation field before deploying."; exit 1; }

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test encrypted FTP connection (no file changes)
        shell: bash
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_FTP_HOST" || { echo "::error::Missing CPANEL_FTP_HOST secret"; exit 1; }
          test -n "$CPANEL_FTP_USER" || { echo "::error::Missing CPANEL_FTP_USER secret"; exit 1; }
          test -n "$CPANEL_FTP_PASSWORD" || { echo "::error::Missing CPANEL_FTP_PASSWORD secret"; exit 1; }
          lftp -u "$CPANEL_FTP_USER","$CPANEL_FTP_PASSWORD" -e "
            set cmd:fail-exit yes
            set ftp:ssl-allow yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ftp:passive-mode yes
            set ssl:verify-certificate yes
            set net:timeout 20
            set net:max-retries 1
            pwd
            cls -1
            bye
          " "ftp://$CPANEL_FTP_HOST"
          echo "FTPS connection is encrypted and authenticated; no files changed."

      - name: Deploy only public website files (no delete, manual)
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$CPANEL_FTP_USER","$CPANEL_FTP_PASSWORD" -e "
            set cmd:fail-exit yes
            set ftp:ssl-allow yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ftp:passive-mode yes
            set ssl:verify-certificate yes
            set net:timeout 20
            set net:max-retries 1
            mirror -R --verbose=1 --parallel=2 --no-perms --ignore-time standalone/public_html/ .
            bye
          " "ftp://$CPANEL_FTP_HOST"
          echo "Public website files uploaded. No server-side deletions performed."
