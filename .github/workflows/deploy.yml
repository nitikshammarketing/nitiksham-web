name: Deploy Nitiksham WordPress Theme to GoDaddy

# Manual only: stage and preview before any production deployment.
on:
  workflow_dispatch:

jobs:
  deploy-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme source
        uses: actions/checkout@v4

      - name: Deploy only Nitiksham theme files
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: "1322647.eu11.myftpupload.com"
          ssh_user: "git_deployer_9936f3e02e_1322647"
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          source_path: "theme/nitiksham"
          deployment_dest: "wp-content/themes/nitiksham"
          cleanup_deleted_files: "no"
          enable_health_check: "yes"
