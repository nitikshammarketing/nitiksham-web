name: Deploy to GoDaddy cPanel

# Builds the pre-rendered site and rsyncs dist/ to public_html.
# Manual only (Actions tab → Run workflow) until the cPanel SSH secrets
# exist — do not re-add a push trigger before docs/DEPLOY.md step 4 is done.
# Required repository secrets (see docs/DEPLOY.md):
#   CPANEL_SSH_HOST, CPANEL_SSH_USER, CPANEL_SSH_KEY, CPANEL_SSH_PORT,
#   CPANEL_DEPLOY_PATH (e.g. public_html)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build
        run: npm run verify

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist/ to cPanel
        run: |
          rsync -avz --delete --exclude '.well-known/' -e "ssh -p ${{ secrets.CPANEL_SSH_PORT }}" \
            dist/ "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_DEPLOY_PATH }}/"
