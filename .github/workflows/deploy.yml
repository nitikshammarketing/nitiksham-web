name: Deploy Nitiksham theme and plugin to GoDaddy (manual)

# Intentionally manual until the GitHub source matches the live WordPress installation.
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Deploy only one component for safer first test"
        type: choice
        required: true
        default: theme
        options:
          - theme
          - plugin
          - both

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify theme and plugin source exists
        shell: bash
        run: |
          test -f wordpress/wp-content/themes/nitiksham-original-v2/style.css || { echo "Theme source missing: do not deploy"; exit 1; }
          test -f wordpress/wp-content/plugins/nitiksham-studio/nitiksham-studio.php || { echo "Plugin source missing: do not deploy"; exit 1; }

      - name: Deploy only the Nitiksham theme
        if: ${{ inputs.component == 'theme' || inputs.component == 'both' }}
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: "1322647.eu11.ssh.myftpupload.com"
          ssh_user: "git_deployer_9936f3e02e_1322647"
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          source_path: "wordpress/wp-content/themes/nitiksham-original-v2"
          deployment_dest: "wp-content/themes/nitiksham-original-v2"
          cleanup_deleted_files: "no"
          enable_health_check: "yes"

      - name: Deploy only the Studio plugin
        if: ${{ inputs.component == 'plugin' || inputs.component == 'both' }}
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: "1322647.eu11.ssh.myftpupload.com"
          ssh_user: "git_deployer_9936f3e02e_1322647"
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          source_path: "wordpress/wp-content/plugins/nitiksham-studio"
          deployment_dest: "wp-content/plugins/nitiksham-studio"
          cleanup_deleted_files: "no"
          enable_health_check: "yes"
