name: Deploy Nitiksham Logo Only (manual)

# Temporary narrowly-scoped recovery for the GoDaddy deployer error.
# Does not touch WordPress database, plugin, uploads, or unrelated theme files.
on:
  push:
    branches: [main]
    paths:
      - ".github/logo-release-once.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first or approve the limited logo deployment"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - deploy

permissions:
  contents: read

concurrency:
  group: nitiksham-production-logo
  cancel-in-progress: false

jobs:
  logo:
    name: Logo files only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4

      - name: Validate logo allowlist and lint changed PHP
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          src="$GITHUB_WORKSPACE/wordpress/wp-content/themes/nitiksham-original-v2"
          grep -vE '^(#|$)' "$GITHUB_WORKSPACE/.github/logo-deploy-files.txt" > "$RUNNER_TEMP/logo-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/logo-files.txt")" -eq 28
          command -v php >/dev/null || { echo "::error::PHP CLI missing on runner"; exit 1; }
          while IFS= read -r item; do
            case "$item" in
              assets/*|pages/*|style.css) ;;
              *) echo "::error::Unexpected file in allowlist"; exit 1 ;;
            esac
            case "$item" in
              *..*|/*) echo "::error::Unsafe file path"; exit 1 ;;
            esac
            test -f "$src/$item" || { echo "::error::Missing file $item"; exit 1; }
            if [[ "$item" == *.php ]]; then php -l "$src/$item"; fi
          done < "$RUNNER_TEMP/logo-files.txt"
          echo "Exactly 28 reviewed logo-related files validated."

      - name: Prepare SSH key
        shell: bash
        env:
          GODADDY_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GODADDY_PRIVATE_KEY" || { echo "::error::PRIVATE_KEY secret missing"; exit 1; }
          umask 077
          printf '%s\n' "$GODADDY_PRIVATE_KEY" > "$RUNNER_TEMP/nitiksham_logo_key"
          chmod 600 "$RUNNER_TEMP/nitiksham_logo_key"

      - name: Verify server destination is writable before any copy
        shell: bash
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/nitiksham_logo_key"
          ssh -i "$keyfile" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            git_deployer_9936f3e02e_1322647@1322647.eu11.ssh.myftpupload.com \
            'set -eu
             root=/html/wp-content/themes/nitiksham-original-v2
             for dir in "$root" "$root/assets" "$root/assets/assets" "$root/pages" "$root"/pages/*; do
               test -d "$dir" || { echo "Missing folder: $dir"; exit 1; }
               test -w "$dir" || { echo "Not writable for deploy account: $dir"; exit 1; }
             done
             echo "All target directories writable; no modifications made."'

      - name: Preview exact logo file sync (no changes)
        shell: bash
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/wordpress/wp-content/themes/nitiksham-original-v2"
          keyfile="$RUNNER_TEMP/nitiksham_logo_key"
          rsync -rcvz --dry-run --itemize-changes --delay-updates \
            --files-from="$RUNNER_TEMP/logo-files.txt" \
            -e "ssh -i $keyfile -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            "$src/" \
            "git_deployer_9936f3e02e_1322647@1322647.eu11.ssh.myftpupload.com:/html/wp-content/themes/nitiksham-original-v2/"
          echo "Dry-run complete. No files changed."

      - name: Copy only the approved logo-related files
        if: ${{ inputs.mode == 'deploy' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/wordpress/wp-content/themes/nitiksham-original-v2"
          keyfile="$RUNNER_TEMP/nitiksham_logo_key"
          rsync -rcvz --itemize-changes --delay-updates \
            --files-from="$RUNNER_TEMP/logo-files.txt" \
            -e "ssh -i $keyfile -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            "$src/" \
            "git_deployer_9936f3e02e_1322647@1322647.eu11.ssh.myftpupload.com:/html/wp-content/themes/nitiksham-original-v2/"

      - name: Verify deployed logo asset checksums
        if: ${{ inputs.mode == 'deploy' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/wordpress/wp-content/themes/nitiksham-original-v2/assets"
          keyfile="$RUNNER_TEMP/nitiksham_logo_key"
          for item in nitiksham-brand.png nitiksham-mark.png nitiksham-favicon.png; do
            expected="$(sha256sum "$src/$item" | cut -d' ' -f1)"
            actual="$(ssh -i "$keyfile" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              git_deployer_9936f3e02e_1322647@1322647.eu11.ssh.myftpupload.com \
              "sha256sum /html/wp-content/themes/nitiksham-original-v2/assets/$item" | cut -d' ' -f1)"
            test "$actual" = "$expected" || { echo "::error::Checksum mismatch: $item"; exit 1; }
            echo "Verified: $item"
          done

      - name: Remove temporary SSH key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nitiksham_logo_key"
