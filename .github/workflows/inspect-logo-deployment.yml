name: Inspect failed logo deployment (read-only)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Expected logo checksum in GitHub
        shell: bash
        run: |
          set -euo pipefail
          test -f wordpress/wp-content/themes/nitiksham-original-v2/assets/nitiksham-brand.png
          sha256sum wordpress/wp-content/themes/nitiksham-original-v2/assets/nitiksham-brand.png

      - name: Inspect currently installed GoDaddy theme without modifying it
        shell: bash
        env:
          GODADDY_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/godaddy_inspect_key"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          printf '%s\n' "$GODADDY_PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            git_deployer_9936f3e02e_1322647@1322647.eu11.ssh.myftpupload.com \
            'set -eu
             dir=/html/wp-content/themes/nitiksham-original-v2
             echo "Theme directory:"
             test -d "$dir" && echo EXISTS || echo MISSING
             for path in assets/nitiksham-brand.png assets/nitiksham-mark.png assets/nitiksham-favicon.png; do
               if [ -f "$dir/$path" ]; then
                 echo "PRESENT: $path"
                 sha256sum "$dir/$path"
               else
                 echo "MISSING: $path"
               fi
             done
             echo "PHP syntax check:"
             php -l "$dir/functions.php" || true
             php -l "$dir/pages/home/index.php" || true'
          echo "Read-only inspection completed. No WordPress files changed."
